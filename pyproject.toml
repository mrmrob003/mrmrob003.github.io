[project]
name = "mrmrob003.github.io"
version = "0.1.0"
description = "Robert Moerman's homepage"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "ruff",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "pymdown-extensions",
    "mkdocs-jupyter",
    "mkdocs-bibtex",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["site", "overrides"]