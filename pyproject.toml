[project]
name = "mrmrob003.github.io"
version = "0.1.0"
description = "Robert Moerman's homepage"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "nbconvert",
    "pre-commit",
    "ruff",
    "ty",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "pymdown-extensions",
    "mkdocs-jupyter",
    "mkdocs-bibtex",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["site", "overrides"]

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501", # let formatter handle line length
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"